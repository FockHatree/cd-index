name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: bash + zsh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zsh 与 shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck

      - name: 语法检查（bash -n / zsh -n）
        run: make check

      - name: shellcheck
        run: make lint

      - name: 测试（bash 39 项 + zsh 40 项断言）
        run: make test
